<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mopzilla Dispatch &amp; Operations OS</title>
<style>
:root{
  --white:#FEFEFE;
  --black:#0B0D0B;
  --gold:#F5AD20;
  --teal:#3B87A2;
  --orange:#A5502C;
  --green:#13392F;
  --green-2:#1b4d3f;
  --gray-100:#F4F5F4;
  --gray-200:#E7E9E7;
  --gray-300:#CBD0CC;
  --gray-500:#7C837D;
  --gray-700:#454A46;
  --danger:#B23A2E;
  --warn:#C97A17;
  --ok:#2E7D57;
  --radius:6px;
  --font-head:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;
  --font-body:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--gray-100);
  color:var(--black);
  font-size:14px;
  line-height:1.45;
}
h1,h2,h3,h4{font-family:var(--font-head);margin:0 0 8px 0;font-weight:800;color:var(--green);}
h1{font-size:22px;} h2{font-size:18px;} h3{font-size:15px;} h4{font-size:13px;}
a{color:var(--teal);}
button{font-family:var(--font-body);cursor:pointer;}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:6px 8px;border-bottom:1px solid var(--gray-200);text-align:left;vertical-align:top;}
th{background:var(--gray-100);font-family:var(--font-head);font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray-700);position:sticky;top:0;}
input,select,textarea{
  font-family:var(--font-body);font-size:13px;padding:6px 8px;border:1px solid var(--gray-300);
  border-radius:4px;background:var(--white);color:var(--black);width:100%;
}
label{display:block;font-size:11px;font-weight:600;color:var(--gray-700);margin:8px 0 3px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;border:1px solid transparent;
  font-size:12px;font-weight:700;background:var(--gray-200);color:var(--black);
}
.btn:hover{filter:brightness(0.95);}
.btn-primary{background:var(--gold);color:var(--black);}
.btn-dark{background:var(--green);color:var(--white);}
.btn-teal{background:var(--teal);color:var(--white);}
.btn-danger{background:var(--danger);color:var(--white);}
.btn-outline{background:transparent;border:1px solid var(--gray-300);}
.btn-sm{padding:4px 9px;font-size:11px;}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}
.pill-ok{background:#e3f3ea;color:var(--ok);}
.pill-warn{background:#fbeed9;color:var(--warn);}
.pill-danger{background:#fbe3e0;color:var(--danger);}
.pill-info{background:#e2eef2;color:var(--teal);}
.pill-neutral{background:var(--gray-200);color:var(--gray-700);}

/* Layout */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:212px;flex:0 0 212px;background:var(--green);color:var(--white);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center;}
#sidebar .brand-badge{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffd876, var(--gold) 70%);
  margin:0 auto 8px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid rgba(255,255,255,.9);
  box-shadow:0 3px 10px rgba(0,0,0,.35);}
#sidebar .brand-badge img{width:100%;height:100%;object-fit:cover;}
#sidebar .brand .name{font-family:var(--font-head);font-weight:800;font-size:18px;letter-spacing:.03em;}
#sidebar .brand .tag{font-size:9.5px;letter-spacing:.14em;color:var(--gold);margin-top:2px;text-transform:uppercase;}
#navlist button svg{flex:0 0 auto;opacity:.85;}
#navlist button.active svg{opacity:1;}
.kpi{border-left:4px solid var(--gold);padding:10px 12px;background:linear-gradient(180deg,var(--white),#fbfbf8);border-radius:6px;
  box-shadow:0 1px 3px rgba(11,13,11,.06);display:flex;flex-direction:column;gap:2px;}
.kpi.accent-teal{border-left-color:var(--teal);}
.kpi.accent-green{border-left-color:var(--green);}
.kpi.accent-orange{border-left-color:var(--orange);}
.card{box-shadow:0 1px 4px rgba(11,13,11,.05);}
.hero-band{background:linear-gradient(120deg,var(--green) 0%, var(--green-2) 60%, #0f3329 100%);color:#fff;border-radius:8px;
  padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 3px 12px rgba(11,13,11,.18);}
.hero-band h2{color:#fff;margin:0 0 4px;}
.hero-band .sub{color:rgba(255,255,255,.75);font-size:12.5px;}
.quickbtn{background:var(--gold);color:var(--black);border:none;padding:10px 16px;border-radius:5px;font-weight:800;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.quickbtn:hover{filter:brightness(1.05);}
.quickbtn.outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);}
.paste-area{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px;}
.grid-editable input{padding:4px 6px;font-size:12px;}
.split-card{border:1px dashed var(--orange);background:#fdf2ec;border-radius:6px;padding:10px 12px;margin-top:8px;}
#navlist{list-style:none;margin:0;padding:8px;flex:1;}
#navlist li{margin-bottom:2px;}
#navlist button{
  width:100%;text-align:left;background:transparent;border:none;color:rgba(255,255,255,.82);
  padding:8px 10px;border-radius:4px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;
}
#navlist button:hover{background:rgba(255,255,255,.08);color:#fff;}
#navlist button.active{background:var(--gold);color:var(--black);}
#navlist .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.45);padding:12px 10px 4px;}
#sidebar .foot{padding:10px 14px;font-size:10px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.12);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--white);border-bottom:1px solid var(--gray-200);padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5;
}
#topbar .datebox{display:flex;align-items:center;gap:8px;}
#content{padding:18px 22px 60px;flex:1;}
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
.grid{display:grid;gap:12px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){#sidebar{position:fixed;left:-220px;transition:left .2s;z-index:50;}#sidebar.open{left:0;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}#content{padding:12px;}}
.kpi{border-left:4px solid var(--gold);padding:8px 12px;background:var(--white);border-radius:4px;border-top:1px solid var(--gray-200);border-right:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);}
.kpi .v{font-family:var(--font-head);font-size:21px;font-weight:800;color:var(--green);}
.kpi .l{font-size:10.5px;color:var(--gray-700);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.alert{border-radius:4px;padding:9px 12px;margin-bottom:6px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;border:1px solid transparent;}
.alert-critical{background:#fbe3e0;border-color:#f0bcb5;color:#7a231a;}
.alert-warning{background:#fbeed9;border-color:#eecf9c;color:#7a5510;}
.alert-info{background:#e2eef2;border-color:#bcdae4;color:#1f5b70;}
.tag{font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.04em;flex:0 0 auto;}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.spread{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.muted{color:var(--gray-500);}
.small{font-size:11.5px;}
.section-title{border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:12px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-200);margin-bottom:12px;flex-wrap:wrap;}
.tabs button{background:transparent;border:none;padding:8px 12px;font-size:12px;font-weight:700;color:var(--gray-700);border-bottom:3px solid transparent;}
.tabs button.active{color:var(--green);border-bottom-color:var(--gold);}
.modal-bg{position:fixed;inset:0;background:rgba(11,13,11,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:30px 14px;}
.modal-bg.open{display:flex;}
.modal{background:var(--white);border-radius:6px;max-width:760px;width:100%;padding:20px 22px;}
.modal h2{display:flex;justify-content:space-between;align-items:center;}
.closeX{background:transparent;border:none;font-size:18px;color:var(--gray-500);cursor:pointer;}
.dispatch-card{border:1px solid var(--gray-200);border-left-width:5px;border-radius:4px;padding:8px 10px;margin-bottom:6px;background:var(--white);}
.dispatch-card.residential{border-left-color:var(--teal);}
.dispatch-card.commercial{border-left-color:var(--green);}
.dispatch-card.propmgmt{border-left-color:var(--gold);}
.dispatch-card.airbnb{border-left-color:var(--orange);}
.dispatch-card.postconstruction{border-left-color:var(--gray-700);}
.travel-row{display:flex;align-items:center;gap:8px;padding:5px 10px;margin:2px 0 2px 10px;border-left:2px dashed var(--gray-300);font-size:11.5px;color:var(--gray-700);background:var(--gray-100);border-radius:3px;}
.travel-row.risk{color:var(--orange);border-left-color:var(--orange);}
.team-col{background:var(--white);border:1px solid var(--gray-200);border-radius:6px;padding:10px;min-width:270px;flex:1;}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12.5px;}
.chk input{width:auto;margin-top:3px;}
.explain{background:var(--gray-100);border-left:3px solid var(--teal);padding:8px 10px;border-radius:4px;font-size:12px;margin-top:6px;}
.explain b{color:var(--green);}
.mono{font-family:ui-monospace,Consolas,monospace;}
.route-svg-box{background:var(--white);border:1px solid var(--gray-200);border-radius:6px;padding:10px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:5px;}
@media print{
  #sidebar,#topbar,.no-print{display:none !important;}
  #content{padding:0;}
  body{background:#fff;}
}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.nav-badge{margin-left:auto;background:var(--gold);color:#0B0D0B;font-size:10px;font-weight:700;border-radius:9px;padding:1px 7px;}
.bar-row{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:12px;}
.bar{background:#EDEFED;border-radius:5px;height:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}
.bar-lbl{font-weight:600;}
.bar-val{font-size:11px;color:#454A46;white-space:nowrap;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.tight{margin:4px 0 0 18px;padding:0;font-size:12.5px;line-height:1.55;}
.g-card{border:1px solid #E1E4E1;border-left:5px solid var(--teal);border-radius:6px;padding:10px 12px;margin:9px 0;background:#fff;}
.g-crit{border-left-color:var(--danger);background:#FDF3F1;}
.g-warn{border-left-color:var(--gold);background:#FFF9EC;}
.g-info{border-left-color:var(--teal);background:#F1F8FA;}
.g-over{opacity:.65;border-left-color:#9AA19B;background:#F5F6F5;}
.g-tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:#0B0D0B;color:#fff;margin-right:6px;}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;font-size:12.5px;line-height:1.45;}
.g-lbl{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#7C837D;margin-bottom:1px;}
.g-opts{margin-top:6px;font-size:12.5px;}
.g-opts ul{margin:2px 0 0 18px;padding:0;}
.pb-row{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:13px;}
.quickbtn.outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);}
@media(max-width:900px){.g-grid{grid-template-columns:1fr;}.two-col{grid-template-columns:1fr;}.bar-row{grid-template-columns:1fr;}}
</style>
</head>

/* ---------------------------------------------------------------------
   ZIP / ROUTE INTELLIGENCE ENGINE
   ------------------------------------------------------------------- */
function buildZipIndex(){
  if(ZIP_INDEX) return ZIP_INDEX;
  const idx = {};
  ZIP_DATA.forEach(r=>{ idx[r[0]] = {zip:r[0],city:r[1],state:r[2],county:r[3],latitude:r[4],longitude:r[5],type:r[6]==="P"?"PO BOX":r[6]==="U"?"UNIQUE":"STANDARD",source:"embedded"}; });
  ((typeof DB!=="undefined" && DB && DB.zip && DB.zip.extra) || []).forEach(r=>{ idx[r.zip] = Object.assign({source:"imported"}, r); });
  ZIP_INDEX = idx; return idx;
}
function zipLookup(code){ if(!code) return null; return buildZipIndex()[String(code).trim()] || null; }
function haversineMiles(lat1,lon1,lat2,lon2){
  const R=3958.8, toRad = d=>d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function isTrafficWindow(timeStr){
  const r = DB.rules;
  const inWin = (t,a,b)=> t>=a && t<=b;
  if(inWin(timeStr, r.trafficMorningStart, r.trafficMorningEnd)) return "Morning rush (high traffic risk)";
  if(inWin(timeStr, r.trafficAfternoonStart, r.trafficAfternoonEnd)) return "Afternoon/return-home window (traffic risk)";
  return null;
}
function speedForAreaType(areaType){
  const r = DB.rules;
  if(areaType==="urban") return r.urbanSpeedMph;
  if(areaType==="rural") return r.ruralSpeedMph;
  return r.suburbanSpeedMph;
}
function routeBetween(zipA, zipB, startTime, areaType){
  const a = zipLookup(zipA), b = zipLookup(zipB);
  if(!a || !b || zipA===zipB){
    return {ok: a&&b?true:false, straightMiles:0, roadMiles:0, minutes:0, trafficNote:null, missing: !a||!b};
  }
  const straight = haversineMiles(a.latitude,a.longitude,b.latitude,b.longitude);
  const road = straight * DB.rules.roadMultiplier;
  const speed = speedForAreaType(areaType||"suburban");
  const minutes = (road/speed)*60;
  const trafficNote = startTime ? isTrafficWindow(startTime) : null;
  return {ok:true, straightMiles: straight, roadMiles: road, minutes, trafficNote, missing:false};
}
function addMinutes(hhmm, mins){
  if(!hhmm) return "";
  const total = timeToMin(hhmm)+Math.round(mins), n=((total%1440)+1440)%1440;
  return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
}
function minutesBetween(hhmm1, hhmm2){
  const [h1,m1]=hhmm1.split(":").map(Number), [h2,m2]=hhmm2.split(":").map(Number);
  return (h2*60+m2)-(h1*60+m1);
}
function timeToMin(hhmm){ if(!hhmm) return 0; const [h,m]=String(hhmm).split(":").map(Number); return (h||0)*60+(m||0); }

function returnHomeStatus(returnTime){
  const r = DB.rules, t=timeToMin(returnTime), start=timeToMin(r.targetHomeReturnStart), end=timeToMin(r.targetHomeReturnEnd);
  if(t < start) return {label:"NORMAL", pill:"pill-ok"};
  if(t <= end) return {label:"ACCEPTABLE / MONITOR", pill:"pill-info"};
  if(t <= end+30) return {label:"WARNING", pill:"pill-warn"};
  return {label:"HIGH RISK", pill:"pill-danger"};
}

function overtimeEvaluation(job, projectedCompletion, projectedReturnHome){
  const r = DB.rules;
  const lateStart = timeToMin(job.startTime||"09:00") >= timeToMin(r.lateJobStart);
  if(!lateStart) return {risk:"LOW", recommend:false, text:"Start time is before the late-day window; overtime risk is low under current rules."};
  const meetsValue = (job.revenue||0) >= r.overtimeMinJobValue;
  const rh = returnHomeStatus(projectedReturnHome || projectedCompletion || "18:00");
  if(!meetsValue) return {risk:"HIGH", recommend:false, text:`Late-day job worth $${(job.revenue||0).toFixed(0)}, below the $${r.overtimeMinJobValue} overtime threshold — overtime is NOT recommended by default.`};
  if(rh.label==="HIGH RISK") return {risk:"HIGH", recommend:false, text:`Job value ($${(job.revenue||0).toFixed(0)}) meets the $${r.overtimeMinJobValue} threshold, but the projected return home (${projectedReturnHome}) is HIGH RISK — approve only with a dispatcher override.`};
  return {risk:"MODERATE", recommend:true, text:`High-value late-day job ($${(job.revenue||0).toFixed(0)} ≥ $${r.overtimeMinJobValue}). Projected return home ${projectedReturnHome} (${rh.label}). Overtime may be justified — dispatcher approval required.`};
}

/* ---------------------------------------------------------------------
   DISPATCH SEQUENCING (per team, per day) — builds cleaning + travel blocks
   ------------------------------------------------------------------- */
function jobsForDate(date){ return DB.jobs.filter(j=>j.date===date); }

function buildTeamSchedule(teamId, date){
  const team = DB.teams.find(t=>t.id===teamId);
  const blocks=[], warnings=[];
  if(!team) return {team:null,blocks,warnings,returnHome:null,totals:{jobs:0,cleanMin:0,travelMin:0,miles:0,hours:0}};
  const jobs = teamJobsOn(teamId,date);
  let prevZip=team.homeZip, prevEnd=null, cleanMin=0, travelMin=0, miles=0;
  jobs.forEach(job=>{
    const rt = routeBetween(prevZip, job.zip, job.startTime, "suburban");
    if(rt.missing){ warnings.push(`ZIP not found in database for job ${job.id} (${job.zip||"—"}) — travel time could not be estimated.`); }
    else if(job.zip!==prevZip){
      blocks.push({type:"travel",from:prevZip,to:job.zip,miles:rt.roadMiles,straight:rt.straightMiles,minutes:rt.minutes,trafficNote:rt.trafficNote,arriveBy:job.startTime});
      travelMin+=rt.minutes; miles+=rt.roadMiles;
    }
    blocks.push({type:"job",job});
    cleanMin += (job.actualCleaningMin||job.plannedCleaningMin||0);
    if(job.zip) prevZip=job.zip;
    prevEnd = job.endTime || addMinutes(job.startTime||"08:00", job.plannedCleaningMin||60);
  });
  let returnBlock=null;
  if(jobs.length){
    const rt = routeBetween(prevZip, team.homeZip, prevEnd, "suburban");
    const arrival = rt.ok ? addMinutes(prevEnd, rt.minutes) : prevEnd;
    returnBlock = {type:"return",from:prevZip,to:team.homeZip,miles:rt.roadMiles||0,minutes:rt.minutes||0,arrival,lastEnd:prevEnd};
    blocks.push(returnBlock); travelMin+=rt.minutes||0; miles+=rt.roadMiles||0;
  }
  const zipSeq = [team.homeZip, ...jobs.map(j=>j.zip)].filter(Boolean);
  for(let i=0;i<zipSeq.length-2;i++){
    const A=zipLookup(zipSeq[i]), B=zipLookup(zipSeq[i+1]), C=zipLookup(zipSeq[i+2]);
    if(A&&B&&C){
      const ab=haversineMiles(A.latitude,A.longitude,B.latitude,B.longitude), ac=haversineMiles(A.latitude,A.longitude,C.latitude,C.longitude), bc=haversineMiles(B.latitude,B.longitude,C.latitude,C.longitude);
      if(ab>DB.rules.backtrackThresholdMiles && bc>DB.rules.backtrackThresholdMiles && ac < Math.min(ab,bc)*0.6)
        warnings.push(`Possible backtracking: the team drives out to ZIP ${zipSeq[i+1]} and then comes back to the area of ${zipSeq[i]} for the next stop.`);
    }
  }
  return {team,blocks,warnings,returnHome:returnBlock,totals:{jobs:jobs.length,cleanMin,travelMin,miles,hours:(cleanMin+travelMin)/60}};
}

/* ---------------------------------------------------------------------
   TENURE / TEAM-SIZE BASED TIME ESTIMATION
   Cleaner nuevo / poca antigüedad: ~500 sq ft por cleaner (rules.newerSqftPerHr)
   Cleaner con experiencia / mayor tenure: ~700–900 sq ft por cleaner
   (rules.experiencedSqftLow – rules.experiencedSqftHigh)
   ------------------------------------------------------------------- */
function sqftPerHourForEmployee(emp, onDate){
  const r = DB.rules;
  if(!emp) return r.newerSqftPerHr;
  if(emp.rateMode==="manual" && emp.avgSqftPerHr>0) return emp.avgSqftPerHr;
  const m = tenureMonths(emp,onDate);
  if(m==null) return r.newerSqftPerHr;
  if(m < r.tenureNewMonths) return r.newerSqftPerHr;
  if(m >= r.tenureSeniorMonths) return r.experiencedSqftHigh;
  const f = (m - r.tenureNewMonths)/(r.tenureSeniorMonths - r.tenureNewMonths);
  return Math.round(r.experiencedSqftLow + f*(r.experiencedSqftHigh - r.experiencedSqftLow));
}
function estimateCleaningMinutes(sqft, employeeIds, onDate){
  const emps = (employeeIds||[]).map(id=>DB.employees.find(e=>e.id===id)).filter(Boolean);
  if(!sqft || emps.length===0) return {minutes:0, explain:"Enter square footage and assign a team (or employees) to calculate the time."};
  const combined = emps.reduce((s,e)=>s+sqftPerHourForEmployee(e,onDate),0);
  const hours = sqft/combined, minutes = Math.round(hours*60);
  const parts = emps.map(e=>`${esc(e.name)} (${esc(employeeLevel(e))}, ${sqftPerHourForEmployee(e,onDate)} sqft/hr)`).join(" + ");
  return {minutes, combined, explain:`${sqft.toLocaleString()} sqft ÷ ${combined} sqft/hr [${parts}] = ${hours.toFixed(2)} h (${minutes} min)`};
}

/* ---------------------------------------------------------------------
   SPLIT ROUTE RECOMMENDATION
   When a team's planned day exceeds capacity (dailyHoursPerTeam) or its
   jobs span geography inefficiently, recommend splitting into two routes.
   This is transparent, rule-based DISPATCH GUIDANCE — not an automatic
   AI decision — the dispatcher still chooses whether to act on it.
   ------------------------------------------------------------------- */
function splitRouteRecommendation(teamId, date){
  const s=buildTeamSchedule(teamId,date), jobs=teamJobsOn(teamId,date);
  if(jobs.length<2) return null;
  const cap=DB.rules.dailyHoursPerTeam, total=s.totals.hours;
  if(total<=cap+0.25) return null;
  let running=0; const half=s.totals.cleanMin/2; let idx=jobs.length-1;
  for(let i=0;i<jobs.length;i++){ running+=(jobs[i].actualCleaningMin||jobs[i].plannedCleaningMin||0); if(running>=half){ idx=i; break; } }
  const routeA=jobs.slice(0,idx+1), routeB=jobs.slice(idx+1);
  if(!routeB.length) return null;
  return {team:s.team,totalHours:total,capacityHours:cap,over:total-cap,routeA,routeB,
    text:`${s.team.name}'s planned day is ${total.toFixed(1)} h against ${cap} h capacity (${(total-cap).toFixed(1)} h over). Consider splitting: Route A (${routeA.map(j=>j.client).join(", ")}) and Route B (${routeB.map(j=>j.client).join(", ")}) — give Route B to another team or a subcontractor.`};
}
function allSplitRecommendations(date){ return DB.teams.map(t=>splitRouteRecommendation(t.id,date)).filter(Boolean); }

/* ---------------------------------------------------------------------
   CONFLICT ENGINE
   ------------------------------------------------------------------- */
function runConflictEngine(date){
  const issues=[], jobs=jobsForDate(date).filter(j=>j.status!=="Cancelled");
  const byEmp={}, byTeam={};
  jobs.forEach(j=>{
    (j.employeeIds||[]).forEach(e=>{ (byEmp[e]=byEmp[e]||[]).push(j); });
    if(j.teamId) (byTeam[j.teamId]=byTeam[j.teamId]||[]).push(j);
  });
  const overlaps=(list,label)=>{
    list.sort((a,b)=>(a.startTime||"").localeCompare(b.startTime||""));
    for(let i=0;i<list.length-1;i++) if(list[i].endTime && list[i+1].startTime && list[i].endTime>list[i+1].startTime)
      issues.push({sev:"CRITICAL", text:`${label} is double-booked: ${list[i].id} (${list[i].startTime}-${list[i].endTime}) overlaps ${list[i+1].id} (${list[i+1].startTime}-${list[i+1].endTime}).`});
  };
  Object.entries(byEmp).forEach(([id,list])=>overlaps(list,(DB.employees.find(e=>e.id===id)||{}).name||id));
  Object.entries(byTeam).forEach(([id,list])=>overlaps(list,(DB.teams.find(t=>t.id===id)||{}).name||id));
  jobs.forEach(j=>{
    if(!j.teamId && j.internalOrSub!=="Subcontractor") issues.push({sev:"CRITICAL", text:`${j.id} (${j.client}) has no team assigned.`});
    if(j.internalOrSub==="Subcontractor" && !j.subcontractorId) issues.push({sev:"WARNING", text:`${j.id} (${j.client}) is marked Subcontractor but none is selected.`});
    if(!j.zip || !zipLookup(j.zip)) issues.push({sev:"WARNING", text:`${j.id} (${j.client}) has a ZIP (${j.zip||"—"}) that is not in the ZIP database — drive time can't be estimated.`});
    if(j.status==="Completed" && !j.actualCleaningMin) issues.push({sev:"INFO", text:`${j.id} is Completed but actual cleaning time was not entered.`});
  });
  return issues;
}

   ------------------------------------------------------------------- */
function payrollForRange(startDate,endDate){
  const jobs=DB.jobs.filter(j=>j.date>=startDate&&j.date<=endDate&&j.status!=="Cancelled"&&j.internalOrSub!=="Subcontractor");
  const pm=payMapForJobs(jobs), byEmp={};
  jobs.forEach(j=>{
    const p=pm[j.id], team=DB.teams.find(t=>t.id===j.teamId);
    p.lines.forEach(l=>{
      const r=byEmp[l.emp.id]=byEmp[l.emp.id]||{employee:l.emp,lines:[],weekHours:{},jobPay:0,hours:0,teams:new Set()};
      r.lines.push({job:j,type:p.type,hours:l.hours,amount:l.amount,hourly:l.hourly});
      r.jobPay+=l.amount; r.hours+=l.hours; if(team) r.teams.add(team.name);
      if(l.hourly){ const wk=weekStartOf(j.date); r.weekHours[wk]=(r.weekHours[wk]||0)+l.hours; }
    });
  });
  const adj=(DB.payAdjustments||[]).filter(a=>a.date>=startDate&&a.date<=endDate);
  adj.forEach(a=>{ const e=DB.employees.find(x=>x.id===a.empId); if(e && !byEmp[e.id]) byEmp[e.id]={employee:e,lines:[],weekHours:{},jobPay:0,hours:0,teams:new Set()}; });
  return Object.values(byEmp).map(r=>{
    let reg=0, ot=0; Object.values(r.weekHours).forEach(h=>{ reg+=Math.min(h,DB.rules.standardWorkWeekHours); ot+=Math.max(0,h-DB.rules.standardWorkWeekHours); });
    const rate=r.employee.hourlyRate||0, otRate=r.employee.otRate||rate*DB.rules.otMultiplier;
    const otPremium=ot*(otRate-rate);
    const adjustments=adj.filter(a=>a.empId===r.employee.id).reduce((s,a)=>s+Number(a.amount||0),0);
    return {employee:r.employee,teams:[...r.teams],hours:r.hours,regularHours:reg,overtimeHours:ot,jobPay:r.jobPay,otPremium,adjustments,
      grossPay:r.jobPay+otPremium+adjustments,lines:r.lines,jobs:r.lines.map(l=>l.job.id)};
  }).sort((a,b)=>a.employee.name.localeCompare(b.employee.name));
}
function collectionsData(){
  return DB.jobs.filter(j=>j.status!=="Cancelled").map(j=>({job:j,invoice:j.id,revenue:j.revenue||0,
    collected:j.paymentStatus==="Paid"?(j.revenue||0):0, balance:j.paymentStatus==="Paid"?0:(j.revenue||0), status:j.paymentStatus||"Unpaid"}));
}
function subPaymentsData(){
  return DB.jobs.filter(j=>j.internalOrSub==="Subcontractor" && j.status!=="Cancelled").map(j=>{
    const sub=DB.subcontractors.find(s=>s.id===j.subcontractorId); let amount=0;
    if(sub){
      if(sub.rateType==="Percentage") amount=(j.revenue||0)*(sub.percentage/100);
      else if(sub.rateType==="Flat") amount=sub.flatRate;
      else if(sub.rateType==="Hourly") amount=(j.actualCleaningMin||j.plannedCleaningMin||0)/60*sub.hourlyRate;
    }
    return {job:j,sub,amount,margin:(j.revenue||0)-amount,status:j.subPaymentStatus||"Pending"};
  });
}
function profitabilityForRange(startDate,endDate){
  const jobs=DB.jobs.filter(j=>j.date>=startDate&&j.date<=endDate&&j.status!=="Cancelled");
  const pm=payMapForJobs(jobs), subs={}; subPaymentsData().forEach(s=>{ subs[s.job.id]=s.amount; });
  let revenue=0,labor=0,subCost=0,cleanMin=0;
  jobs.forEach(j=>{
    revenue+=j.revenue||0;
    if(j.internalOrSub==="Subcontractor") subCost+=subs[j.id]||0; else labor+=pm[j.id].total;
    cleanMin+=j.actualCleaningMin||j.plannedCleaningMin||0;
  });
  let travelMin=0, miles=0; const seen={};
  jobs.forEach(j=>{ if(!j.teamId) return; const k=j.date+"|"+j.teamId; if(seen[k]) return; seen[k]=1; const t=buildTeamSchedule(j.teamId,j.date).totals; travelMin+=t.travelMin; miles+=t.miles; });
  const grossProfit=revenue-labor-subCost;
  return {revenue,labor,subCost,grossProfit,margin:revenue?grossProfit/revenue*100:0,cleanHours:cleanMin/60,travelHours:travelMin/60,miles,jobCount:jobs.length,
    revenuePerCleanHour:cleanMin?revenue/(cleanMin/60):0, revenuePerTeamHour:(cleanMin+travelMin)?revenue/((cleanMin+travelMin)/60):0};
}
function capacityForecast(days, startDate){
  const start = startDate || todayStr(), out=[];
  for(let i=0;i<days;i++){
    const date=dateAdd(start,i);
    const jobs=jobsForDate(date).filter(j=>j.status!=="Cancelled");
    let hours=0;
    DB.teams.forEach(t=>{ hours += buildTeamSchedule(t.id,date).totals.hours||0; });
    jobs.filter(j=>!j.teamId && j.internalOrSub!=="Subcontractor").forEach(j=>{ hours += (j.plannedCleaningMin||60)/60; });
    const avail=DB.teams.filter(t=>teamAvailableOn(t,date));
    const cap=avail.length*DB.rules.dailyHoursPerTeam;
    const util = cap ? hours/cap*100 : (hours>0?999:0);
    out.push({date, jobCount:jobs.length, estHours:hours, capacityHours:cap, internalDailyHours:cap, teamsAvailable:avail.length,
      utilization:Math.min(util,999), gap:Math.max(0,hours-cap), subJobs:jobs.filter(j=>j.internalOrSub==="Subcontractor").length});
  }
  return out;
}
function distantDemandClusters(){
  const since = dateAdd(todayStr(), -DB.rules.distantDemandWindowDays), clusters={};
  DB.jobs.filter(j=>j.date>=since && j.zip).forEach(j=>{ (clusters[j.zip]=clusters[j.zip]||[]).push(j); });
  const flagged=[];
  Object.entries(clusters).forEach(([zip,list])=>{
    if(list.length<2) return;
    let minMin=Infinity;
    DB.teams.forEach(t=>{ const m=roadMin(t.homeZip,zip); if(m!=null) minMin=Math.min(minMin,m); });
    if(minMin>=DB.rules.distantDemandTravelMinThreshold || list.length>=DB.rules.distantDemandClusterCount){
      const z=zipLookup(zip);
      flagged.push({zip, city:z?z.city:zip, count:list.length, minTravelMinutes:minMin===Infinity?null:minMin, revenue:list.reduce((s,j)=>s+(j.revenue||0),0)});
    }
  });
  return flagged.sort((a,b)=>b.count-a.count);
}

function parseRoutePaste(){
  const raw=document.getElementById("rrPaste").value; if(!raw.trim()) return;
  let added=0,last=null;
  raw.split(/\r?\n/).filter(l=>l.trim()).forEach((line,idx)=>{
    const c=(line.includes("\t")?line.split("\t"):line.split(",")).map(x=>(x||"").trim());
    if(idx===0 && /^team$/i.test(c[0])) return;
    if(!c[1]) return;
    routeReviewRows.push({team:c[0],client:c[1],address:c[2]||"",zip:c[3]||"",amount:(c[4]||"").replace(/[$,]/g,""),sqft:(c[5]||"").replace(/,/g,""),start:c[6]||""});

}
function commitRouteReview(){
  const date=routeReviewDate; let created=0,updated=0,skipped=0; const byTeam={};
  routeReviewRows.forEach(r=>{
    if(!r.client){ skipped++; return; }
    const team=DB.teams.find(t=>r.team&&t.name.toLowerCase()===r.team.toLowerCase());
    (byTeam[team?team.id:"_none"]=byTeam[team?team.id:"_none"]||[]).push(r);
  });
  Object.entries(byTeam).forEach(([tid,rows])=>{
    const team=DB.teams.find(t=>t.id===tid);
    let list=rows.map(r=>{
      const client=DB.clients.find(c=>c.name.toLowerCase()===r.client.toLowerCase());
      const prop=client?DB.properties.find(p=>p.clientId===client.id&&(!r.zip||p.zip===r.zip)):null;
      return {r,client,prop,sqft:Number(r.sqft)||(prop?prop.sqft:0)};
    });
    if(team && rrAutoOrder && list.length>1){
      const res=optimalOrder(team.homeZip, list.map((x,i)=>({id:i,zip:x.r.zip,fixed:!!x.r.start})));
      if(res) list=res.order.map(o=>list[o.id]);
    }
    const ids=[];
    list.forEach(({r,client,prop,sqft})=>{
      const z=zipLookup(r.zip), employeeIds=team?team.employeeIds.slice():[];
      const existing=DB.jobs.find(j=>j.date===date&&j.client.toLowerCase()===r.client.toLowerCase()&&j.zip===r.zip&&j.status!=="Cancelled");
      const est=sqft?estimateCleaningMinutes(sqft,employeeIds,date):{minutes:0};
      const dur=est.minutes||(existing?existing.plannedCleaningMin:0)||120;
      const price=Number(r.amount)||(existing&&existing.revenue)||suggestedClientPrice(client,sqft)||0;
      const payload={date,client:r.client,clientId:client?client.id:"",propertyId:prop?prop.id:"",address:r.address||(prop?prop.address:(existing?existing.address:"")),
        city:z?z.city:(existing?existing.city:""),state:z?z.state:(existing?existing.state:""),zip:r.zip,county:z?z.county:(existing?existing.county:""),
        serviceCategory:existing?existing.serviceCategory:(client&&client.type==="Commercial"?"Commercial":client&&client.type==="Property Management"?"Property Management":"Residential"),
        jobType:existing?existing.jobType:"Regular",sqft,teamId:team?team.id:"",employeeIds,internalOrSub:"Internal",
        revenue:price,plannedCleaningMin:dur,status:existing?(team?(existing.status==="Unassigned"?"Scheduled":existing.status):(existing.status==="Completed"?"Completed":"Unassigned")):(team?"Scheduled":"Unassigned"),flexibility:existing?existing.flexibility:(client?client.flexibility:"Semi-Flexible"),
        startTime:r.start||"",lockStart:!!r.start,endTime:r.start?addMinutes(r.start,dur):"",
        notes:sqft?(existing?existing.notes||"":""):"Duration is a default (no sqft on file) — enter sqft to calculate it from the crew."};
      let job;
      if(existing){ Object.assign(existing,payload); if(!r.start){ existing.startTime=""; existing.endTime=""; } job=existing; updated++; }
      else { job=mkJob(Object.assign({id:uid("MZ")},payload)); DB.jobs.push(job); created++; }
      ids.push(job.id);
    });
    if(team) resequenceTeam(team.id,date,ids,team.startTime);
    else ids.forEach(id=>{ const j=DB.jobs.find(x=>x.id===id); if(j&&!j.startTime){ j.startTime=""; } });
  });
  logAudit("Daily routes saved","",`${created} created, ${updated} updated, ${skipped} skipped`,date);
  saveDB();
  routeReviewRows=[];
  const m=document.getElementById("rrCommitMsg");
  if(m) m.innerHTML=`<span class="pill pill-ok">${created} created</span> <span class="pill pill-info">${updated} updated</span> ${skipped?`<span class="pill pill-warn">${skipped} skipped (no client)</span>`:""}`;
  renderNav(); renderRRTabs(); renderRRGrid(); renderRROutcome();
}

    let html=`<b>Time (crew size + tenure):</b> ${est.explain}`;
    if(est.minutes>0 && Number(q("#plannedInput").value)!==est.minutes) html+=` <button type="button" class="btn btn-outline btn-sm" id="applyEst">Use ${est.minutes} min</button>`;
    if(team && zip && q("#iosSel").value==="Internal"){
      const rt=routeBetween(team.homeZip,zip,q("#startInput").value,"suburban");
      if(rt.ok&&!rt.missing) html+=`<br><b>Drive from ${esc(team.name)}'s base:</b> ~${rt.roadMiles.toFixed(0)} est. road mi · ~${Math.round(rt.minutes)} min ${(rt.roadMiles>team.maxTravelDistance||rt.minutes>team.maxTravelTime)?'<span class="pill pill-danger">beyond team limit</span>':(rt.roadMiles>team.preferredRadius?'<span class="pill pill-warn">beyond preferred radius</span>':'<span class="pill pill-ok">within range</span>')}`;
    }
    if(price!==null) html+=`<br><b>Suggested price (rate card):</b> ${money(price)} <button type="button" class="btn btn-outline btn-sm" id="applyPrice">Use ${money(price)}</button>`;
    if(team){
      const tmp=Object.assign({},j,{teamId:team.id,employeeIds:emps,revenue:Number(q("#revenueInput").value)||0,plannedCleaningMin:Number(q("#plannedInput").value)||0,actualCleaningMin:Number(q("[name=actualCleaningMin]").value)||0,payOverride:q("#payOverrideInput").value===""?null:Number(q("#payOverrideInput").value),status:"Scheduled",internalOrSub:"Internal"});
      const p=jobPay(tmp,0), rev=tmp.revenue;
      html+=`<br><b>Team pay:</b> ${money(p.total)} (${esc(p.type)}${p.basis?" — "+esc(p.basis):""})${rev?` · pay is ${(p.total/rev*100).toFixed(0)}% of the amount, margin after pay ${money(rev-p.total)}`:""}`;
    }
    q("#estimateBox").innerHTML=html;
    const ae=q("#applyEst"); if(ae) ae.onclick=()=>{ q("#plannedInput").value=est.minutes; plannedDirty=false; updateEnd(); refreshEstimate(false); };
    const ap=q("#applyPrice"); if(ap) ap.onclick=()=>{ q("#revenueInput").value=price.toFixed(2); refreshEstimate(false); };
  }
  q("#svcCatSel").onchange=refreshJobTypes; q("#iosSel").onchange=()=>{ refreshIOS(); refreshEstimate(false); };
  q("#jobZipInput").oninput=()=>{ refreshZip(); refreshEstimate(false); };
  q("#teamSel").onchange=()=>{ const t=DB.teams.find(x=>x.id===q("#teamSel").value); document.querySelectorAll("#jobForm input[name=emp]").forEach(cb=>{ cb.checked=!!(t&&t.employeeIds.includes(cb.value)); }); refreshEstimate(true); };
  document.querySelectorAll("#jobForm input[name=emp]").forEach(cb=>cb.addEventListener("change",()=>refreshEstimate(true)));
  q("[name=sqft]").addEventListener("input",()=>refreshEstimate(true));
  q("[name=date]").addEventListener("change",()=>refreshEstimate(true));
  q("#plannedInput").addEventListener("input",()=>{ plannedDirty=true; updateEnd(); refreshEstimate(false); });
  q("#startInput").addEventListener("input",()=>{ updateEnd(); refreshEstimate(false); });
  q("#endInput").addEventListener("input",()=>{ endDirty=true; });
  ["#revenueInput","#payOverrideInput","[name=actualCleaningMin]"].forEach(s=>q(s).addEventListener("input",()=>refreshEstimate(false)));
  q("[name=client]").addEventListener("change",()=>{
    const c=DB.clients.find(x=>x.name.toLowerCase()===q("[name=client]").value.toLowerCase()); if(!c) return;
    const p=DB.properties.find(x=>x.clientId===c.id);
    if(p && !q("[name=address]").value){ q("[name=address]").value=p.address; q("#jobZipInput").value=p.zip; if(!q("[name=sqft]").value) q("[name=sqft]").value=p.sqft||""; refreshZip(); }
    q("[name=flexibility]").value=c.flexibility||"Semi-Flexible";
    q("#svcCatSel").value=c.type==="Commercial"?"Commercial":c.type==="Property Management"?"Property Management":q("#svcCatSel").value; refreshJobTypes();
    refreshEstimate(true);
  });
  refreshJobTypes(); refreshIOS(); refreshZip(); refreshEstimate(false);
  document.getElementById("jobForm").onsubmit=function(ev){
    ev.preventDefault();
    const data=Object.fromEntries(new FormData(ev.target).entries()); delete data.emp;
    data.employeeIds=checked(); data.recurring=data.recurring==="true";
    ["sqft","plannedCleaningMin","revenue","actualCleaningMin"].forEach(f=>{ data[f]=Number(data[f])||0; });
    data.payOverride=(data.payOverride===""||data.payOverride==null)?null:Number(data.payOverride);
    if(data.internalOrSub==="Subcontractor"){ data.teamId=""; data.employeeIds=[]; } else data.subcontractorId="";
    if(data.internalOrSub==="Internal" && !data.teamId && data.status==="Scheduled") data.status="Unassigned";
    if(data.teamId && data.status==="Unassigned") data.status="Scheduled";
    const z=zipLookup(data.zip); if(z){ data.city=z.city; data.state=z.state; data.county=z.county; }
    if(data.startTime && !data.endTime && data.plannedCleaningMin) data.endTime=addMinutes(data.startTime,data.plannedCleaningMin);
    const est=estimateCleaningMinutes(data.sqft,data.employeeIds,data.date);
    const idx=DB.jobs.findIndex(x=>x.id===data.id);
    if(est.minutes>0 && data.plannedCleaningMin!==est.minutes) logAudit("Duration overridden",`${est.minutes} min (tenure formula)`,`${data.plannedCleaningMin} min`,`${data.id} ${data.client}`);
    if(idx>-1){ const prev=DB.jobs[idx]; DB.jobs[idx]=Object.assign({},prev,data); logAudit("Job updated",`${prev.status}`,`${data.status}`,data.id); }
    else { DB.jobs.push(mkJob(data)); logAudit("Job created","",data.id,data.client); }
    saveDB(); closeModal(); render();
  };
}
function deleteJob(id){
  if(!confirm("Delete job "+id+"? This cannot be undone.")) return;
  DB.jobs=DB.jobs.filter(j=>j.id!==id); logAudit("Job deleted",id,"","Manual delete"); saveDB(); closeModal(); render();
}

function suggestedClientPrice(client, sqft){
  if(!client) return null;
  const cands=[(client.ratePerSqft||0)*(sqft||0), client.flatRate||0].filter(v=>v>0);
  if(!cands.length) return null;
  return Math.round(Math.max(...cands, client.minimumCharge||0)*100)/100;
}

  </div>

  window.calcRoute = function(){

      <div class="kpi"><div class="v">${rt.straightMiles.toFixed(1)} mi</div><div class="l">Straight-Line Distance</div></div>
      <div class="kpi"><div class="v">${rt.roadMiles.toFixed(1)} mi</div><div class="l">Estimated Road Distance</div></div>
      <div class="kpi"><div class="v">${Math.round(rt.minutes)} min</div><div class="l">Estimated Travel Time</div></div>

    </div>
    <p class="small muted" style="margin-top:8px;">Estimated Road Distance = straight-line miles × road multiplier (${DB.rules.roadMultiplier}, editable in Rule Engine). This is an estimate, not exact driving distance or live routing.</p>`;
  };
  renderRouteSvg();
  const bw = document.getElementById("btWarnings");
  let warns=[];
  DB.teams.forEach(t=>{ const s=buildTeamSchedule(t.id, workingDate); s.warnings.forEach(w=>warns.push(`[${t.name}] ${w}`)); });
  bw.innerHTML = warns.length? warns.map(w=>`<div class="alert alert-warning">${esc(w)}</div>`).join("") : `<p class="muted small">No routing warnings for ${esc(workingDate)}.</p>`;
}
function renderRouteSvg(){
  const wrap = document.getElementById("routeSvgWrap");
  const jobs = jobsForDate(workingDate).filter(j=>zipLookup(j.zip));
  const pts = [];
  DB.teams.forEach(t=>{ const z=zipLookup(t.homeZip); if(z) pts.push({lat:z.latitude,lon:z.longitude,label:t.name,type:"base"}); });
  jobs.forEach(j=>{ const z=zipLookup(j.zip); pts.push({lat:z.latitude,lon:z.longitude,label:j.id,type:"job",teamId:j.teamId}); });
  if(pts.length===0){ wrap.innerHTML = `<p class="muted small">No geocoded jobs for this date.</p>`; return; }
  const lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const pad = 0.05;
  const W=640,H=380;
  const xOf = lon => 20 + ( (lon-(minLon-pad)) / ((maxLon-minLon)+2*pad || 1) ) * (W-40);
  const yOf = lat => H-20 - ( (lat-(minLat-pad)) / ((maxLat-minLat)+2*pad || 1) ) * (H-40);
  const teamColors = {}; DB.teams.forEach(t=> teamColors[t.id]=teamColorFor(t.id));
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fbfbfa;border-radius:4px;">`;
  // routes per team
  DB.teams.forEach(t=>{
    const sched = buildTeamSchedule(t.id, workingDate);
    const seq = [t.homeZip, ...sched.blocks.filter(b=>b.type==="job").map(b=>b.job.zip), t.homeZip].filter(z=>zipLookup(z));
    for(let i=0;i<seq.length-1;i++){
      const A=zipLookup(seq[i]), B=zipLookup(seq[i+1]); if(!A||!B) continue;
      svg += `<line x1="${xOf(A.longitude)}" y1="${yOf(A.latitude)}" x2="${xOf(B.longitude)}" y2="${yOf(B.latitude)}" stroke="${teamColors[t.id]}" stroke-width="1.6" stroke-dasharray="4,3" opacity="0.7"/>`;
    }
  });
  pts.forEach(p=>{
    const x=xOf(p.lon), y=yOf(p.lat);
    if(p.type==="base"){
      svg += `<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${teamColors[DB.teams.find(t=>t.name===p.label)?.id]||'#13392F'}" stroke="#0B0D0B"/>`;
      svg += `<text x="${x+8}" y="${y+3}" font-size="9" fill="#0B0D0B">${esc(p.label)} (base)</text>`;
    } else {
      const c = p.teamId ? (teamColors[p.teamId]||"#7C837D") : "#B23A2E";
      svg += `<circle cx="${x}" cy="${y}" r="5" fill="${c}" stroke="#fff" stroke-width="1"/>`;
      svg += `<text x="${x+7}" y="${y+3}" font-size="8.5" fill="#454A46">${esc(p.label)}</text>`;
    }
  });
  svg += `</svg>`;
  wrap.innerHTML = `<div class="route-svg-box">${svg}<div class="small muted" style="margin-top:6px;">Squares = team home base. Circles = jobs (colored by assigned team; red = unassigned). Dashed lines = planned travel sequence. Positions from ZIP centroid data — schematic, not a precise map.</div></div>`;
}

      const rows = collectionsData().filter(r=>r.job.date===workingDate);
      html = table(["Invoice","Client","Revenue","Balance","Status"], rows.map(r=>`<tr><td>${esc(r.invoice)}</td><td>${esc(r.job.client)}</td><td>${money(r.revenue)}</td><td>${money(r.balance)}</td><td>${esc(r.status)}</td></tr>`).join(""));

      html = table(["Employee","Jobs Today","Hours Today"], DB.employees.map(e=>{
        const ej = jobs.filter(j=>(j.employeeIds||[]).includes(e.id));
        const min = ej.reduce((s,j)=>s+(j.actualCleaningMin||j.plannedCleaningMin||0),0);
        return `<tr><td>${esc(e.name)}</td><td>${ej.length}</td><td>${(min/60).toFixed(2)}</td></tr>`;
      }).join(""));
    } else if(name==="Actual vs Planned"){
      html = table(["Job","Planned Clean","Actual Clean","Variance (min)"], jobs.map(j=>{
        const v = (j.actualCleaningMin||0)-(j.plannedCleaningMin||0);
        return `<tr><td>${esc(j.id)}</td><td>${j.plannedCleaningMin}</td><td>${j.actualCleaningMin||0}</td><td>${j.actualCleaningMin? (v>=0?"+":"")+v : "—"}</td></tr>`;
      }).join(""));
    } else if(name==="Overtime"){
      const late = jobs.filter(j=>timeToMin(j.startTime||"00:00")>=timeToMin(DB.rules.lateJobStart));
      html = table(["Job","Start","Revenue","Evaluation"], late.map(j=>{ const oe=overtimeEvaluation(j,j.endTime,j.endTime); return `<tr><td>${esc(j.id)}</td><td>${esc(j.startTime)}</td><td>${money(j.revenue)}</td><td>${esc(oe.risk)} — ${oe.recommend?"possible":"not recommended"}</td></tr>`; }).join(""));
    }
    document.getElementById("reportBody").innerHTML = html || `<p class="muted">No data for this report on ${workingDate}.</p>`;
  };
}

function renderChecklists(root){
  root.innerHTML = `<div class="card no-print"><h3>Checklist Center</h3>
  <div class="hstack" style="flex-wrap:wrap;">${Object.keys(CHECKLIST_DEFS).map(k=>`<button class="btn btn-outline btn-sm" onclick="showChecklist('${k.replace(/'/g,"\\'")}')">${k}</button>`).join("")}
  <button class="btn btn-dark btn-sm" onclick="showDailyClose()">Daily Close Workflow</button>
  <button class="btn btn-teal btn-sm" onclick="showRescheduleScenario()">Move / Reschedule a Client</button>
  <button class="btn btn-teal btn-sm" onclick="showHiringScenario()">Add a Team Member?</button></div></div>
  <div class="card" id="checklistBody"><p class="muted">Select a checklist or scenario above.</p></div>`;
  window.showChecklist = function(name){
    const key = "cl_"+name+"_"+workingDate;
    DB.checklistState[key] = DB.checklistState[key] || {};
    const items = CHECKLIST_DEFS[name];

      ${items.map((it,i)=>`<label class="chk"><input type="checkbox" ${DB.checklistState[key][i]?"checked":""} onchange="toggleCheck('${key}',${i},this.checked)"> ${esc(it)}</label>`).join("")}`;
  };
  window.toggleCheck = function(key, i, val){ DB.checklistState[key][i]=val; saveDB(); };
  window.showDailyClose = function(){
    const key = "cl_Before Closing Day_"+workingDate;
    DB.checklistState[key] = DB.checklistState[key] || {};
    const items = CHECKLIST_DEFS["Before Closing Day"];
    const conflicts = runConflictEngine(workingDate);
    const critical = conflicts.filter(c=>c.sev==="CRITICAL");
    document.getElementById("checklistBody").innerHTML = `<h4>Daily Close — ${esc(workingDate)}</h4>
      ${critical.length? `<div class="alert alert-critical"><b>${critical.length} CRITICAL issue(s) block day close:</b><br>${critical.map(c=>esc(c.text)).join("<br>")}</div>`:""}
      ${items.map((it,i)=>`<label class="chk"><input type="checkbox" ${DB.checklistState[key][i]?"checked":""} onchange="toggleCheck('${key}',${i},this.checked)"> ${esc(it)}</label>`).join("")}
      <div class="hstack" style="margin-top:12px;">
        <button class="btn btn-primary" ${critical.length?"disabled":""} onclick="closeDay(false)">Close Day</button>
        ${critical.length? `<button class="btn btn-danger" onclick="closeDay(true)">Override &amp; Close (logged)</button>`:""}
      </div>`;
  };
  window.closeDay = function(override){
    const reason = override ? prompt("Reason for overriding unresolved critical issues:") : "";
    if(override && !reason) return;
    DB.dayCloseLog.push({date:workingDate, closedAt:new Date().toISOString(), override, reason});
    logAudit("Day closed", "", workingDate, override?("Override: "+reason):"Normal close");
    saveDB(); flashMsg("Day closed for "+workingDate+(override?" (with override)":""));
  };

  /* --- Scenario: Move / Reschedule a Client — is a weekend appointment possible? --- */
  window.showRescheduleScenario = function(){
    const jobOpts = DB.jobs.slice().sort((a,b)=>b.date.localeCompare(a.date))
      .map(j=>`<option value="${j.id}">${esc(j.date)} · ${esc(j.client)} · ${esc(j.id)}</option>`).join("");
    document.getElementById("checklistBody").innerHTML = `<h4>Move / Reschedule a Client</h4>

        <div style="display:flex;align-items:flex-end;"><button class="btn btn-primary" onclick="checkRescheduleFeasibility()">Check Feasibility</button></div>
      </div>
      <div id="rsResult" style="margin-top:10px;"></div>`;
  };
  window.checkRescheduleFeasibility = function(){
    const jobId = document.getElementById("rsJobSel").value;
    const targetDate = document.getElementById("rsNewDate").value;
    const job = DB.jobs.find(j=>j.id===jobId);
    const box = document.getElementById("rsResult");
    if(!job || !targetDate){ box.innerHTML = `<div class="alert alert-warning">Pick a job and a target date.</div>`; return; }
    const client = DB.clients.find(c=>c.name===job.client);
    const flexibility = job.flexibility || (client && client.flexibility) || "Unknown";
    const dow = new Date(targetDate+"T00:00").getDay();
    const isWeekend = dow===0 || dow===6;
    const neededHours = ((job.plannedCleaningMin||120))/60;
    let verdict, verdictClass, detail;
    if(isWeekend){
      const weekendTeams = DB.teams.filter(t=>teamAvailableOn(t,targetDate));
      if(weekendTeams.length===0){
        verdict = "NO — weekend appointment is not currently possible.";
        verdictClass = "alert-critical";
        detail = `No team is configured for weekend availability (check each team's Availability field in Teams). Offer the nearest weekday alternative, or use a subcontractor.`;
      } else {
        const capacityHours = DB.rules.dailyHoursPerTeam;
        const options = weekendTeams.map(t=>{
          const sched = buildTeamSchedule(t.id, targetDate);
          let used=0; sched.blocks.forEach(b=>{ if(b.type==="job") used+=(b.job.plannedCleaningMin||0)/60; if(b.type==="travel"||b.type==="return") used+=(b.minutes||0)/60; });
          return {team:t, open: capacityHours-used};
        }).sort((a,b)=>b.open-a.open);
        const best = options[0];
        if(best.open >= neededHours){
          verdict = `YES — ${best.team.name} works weekends and has ${best.open.toFixed(1)}h open on ${targetDate}.`;
          verdictClass = "alert-info";
          detail = `Needed: ~${neededHours.toFixed(1)}h. Other weekend teams: ${options.slice(1).map(o=>`${o.team.name} (${o.open.toFixed(1)}h open)`).join(", ")||"none"}.`;
        } else {
          verdict = `WEEKEND TEAM EXISTS BUT IS FULLY BOOKED — ${best.team.name} only has ${best.open.toFixed(1)}h open on ${targetDate} (needs ~${neededHours.toFixed(1)}h).`;
          verdictClass = "alert-warning";
          detail = `Consider the next available Saturday, splitting the job, or a subcontractor.`;
        }
      }
    } else {
      const cap = capacityForecast(1).find(()=>true);
      verdict = `Weekday requested — no weekend-availability question here. Check general team capacity on ${targetDate} below before confirming.`;
      verdictClass = "alert-info";
      detail = DB.teams.map(t=>{
        const sched = buildTeamSchedule(t.id, targetDate);
        let used=0; sched.blocks.forEach(b=>{ if(b.type==="job") used+=(b.job.plannedCleaningMin||0)/60; if(b.type==="travel"||b.type==="return") used+=(b.minutes||0)/60; });
        return `${t.name}: ${(DB.rules.dailyHoursPerTeam-used).toFixed(1)}h open`;
      }).join(" · ");
    }
    box.innerHTML = `
      <div class="alert ${verdictClass}"><b>${esc(verdict)}</b></div>
      <p class="small muted">${esc(detail)}</p>
      <table><tbody>
        <tr><td>Client</td><td>${esc(job.client)}</td></tr>
        <tr><td>Client flexibility on file</td><td>${esc(flexibility)}</td></tr>
        <tr><td>Current date / team</td><td>${esc(job.date)} / ${(DB.teams.find(t=>t.id===job.teamId)||{}).name||"—"}</td></tr>
        <tr><td>Target date</td><td>${esc(targetDate)} (${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dow]})</td></tr>
      </tbody></table>
      <h4 style="margin-top:12px;">Before Rescheduling — checklist</h4>
      ${CHECKLIST_DEFS["Before Rescheduling"].map(it=>`<label class="chk"><input type="checkbox"> ${esc(it)}</label>`).join("")}
    `;
  };

  /* --- Scenario: Add a Team Member — capacity-based hiring justification --- */
  window.showHiringScenario = function(){
    document.getElementById("checklistBody").innerHTML = `<h4>Add a Team Member — Capacity Justification</h4>
      <div class="grid grid-2">
        <div><label>Look-ahead window (days)</label><input type="number" id="hireDays" value="14" min="3" max="60"></div>

function roadMiles(zipA, zipB){
  if(!zipA||!zipB) return null; if(zipA===zipB) return 0;
  const k=zipA+"|"+zipB; if(_distCache.has(k)) return _distCache.get(k);
  const a=zipLookup(zipA), b=zipLookup(zipB); let v=null;
  if(a&&b) v = haversineMiles(a.latitude,a.longitude,b.latitude,b.longitude)*DB.rules.roadMultiplier;
  _distCache.set(k,v); return v;
}
function roadMin(zipA, zipB){ const mi=roadMiles(zipA,zipB); return mi==null ? null : mi/DB.rules.suburbanSpeedMph*60; }
function routeCostMin(homeZip, zips){
  let prev=homeZip, tot=0;
  for(const z of zips){ const m=roadMin(prev,z); if(m==null) return null; tot+=m; prev=z; }
  const back=roadMin(prev,homeZip); return back==null ? null : tot+back;
}
function bestInsertion(homeZip, zips, newZip){
  const base=routeCostMin(homeZip,zips); if(base==null) return null;
  let best=null;
  for(let i=0;i<=zips.length;i++){
    const arr=zips.slice(0,i).concat([newZip],zips.slice(i));
    const c=routeCostMin(homeZip,arr); if(c==null) return null;
    if(!best||c<best.total) best={total:c,pos:i};
  }
  return {added:best.total-base, pos:best.pos, total:best.total, base};
}
function optimalOrder(homeZip, items){
  const cost = arr => routeCostMin(homeZip, arr.map(x=>x.zip));
  const curMin = cost(items); if(curMin==null) return null;
  const slots = items.map((x,i)=>x.fixed?-1:i).filter(i=>i>=0);
  const movable = slots.map(i=>items[i]);
  let best = {order:items.slice(), min:curMin};
  const build = perm => { const out=items.slice(); slots.forEach((s,k)=>{ out[s]=perm[k]; }); return out; };
  if(movable.length>=2){
    if(movable.length<=7){
      const used=new Array(movable.length).fill(false), perm=[];
      const rec = ()=>{
        if(perm.length===movable.length){ const arr=build(perm), c=cost(arr); if(c!==null && c<best.min-1e-6) best={order:arr,min:c}; return; }
        for(let i=0;i<movable.length;i++){ if(used[i]) continue; used[i]=true; perm.push(movable[i]); rec(); perm.pop(); used[i]=false; }
      };
      rec();
    } else {
      let perm = movable.slice(), improved=true, guard=0;

function crewNames(team){ return team.employeeIds.map(id=>(DB.employees.find(e=>e.id===id)||{}).name).filter(Boolean).join(", ")||"—"; }
function crewSpeed(team){ return team.employeeIds.map(id=>DB.employees.find(e=>e.id===id)).filter(Boolean).reduce((s,e)=>s+sqftPerHourForEmployee(e),0); }
let payStart=null, payEnd=null, payTab="employee";
function setPayRange(kind){
  if(kind==="week"){ const w=weekRangeOf(workingDate); payStart=w.start; payEnd=w.end; }
  else if(kind==="last"){ const w=weekRangeOf(dateAdd(workingDate,-7)); payStart=w.start; payEnd=w.end; }
  else { payStart=workingDate; payEnd=workingDate; }
  render();
}
function setPayStatus(key,v){ DB.payStatus[key]=v; logAudit("Payroll status",key,v,""); saveDB(); }
function addPayAdjustment(){
  const amt=Number(document.getElementById("adjAmt").value);
  if(!amt){ flashMsg("Enter an amount."); return; }
  DB.payAdjustments.push({id:uid("ADJ"),empId:document.getElementById("adjEmp").value,date:document.getElementById("adjDate").value,amount:amt,note:document.getElementById("adjNote").value});
  logAudit("Pay adjustment added","",String(amt),document.getElementById("adjNote").value); saveDB(); render();
}
function delPayAdjustment(id){ DB.payAdjustments=DB.payAdjustments.filter(a=>a.id!==id); saveDB(); render(); }
function saveTeamPayRow(tid){
  const row=document.querySelector(`#payTeamTable tr[data-tid="${tid}"]`), t=DB.teams.find(x=>x.id===tid); if(!row||!t) return;
  t.payType=row.querySelector(".tp-type").value; t.payPercent=Number(row.querySelector(".tp-pct").value)||0;
  logAudit("Team pay method changed","",t.name,t.payType==="Percent"?t.payPercent+"% of job":"hourly"); saveDB(); flashMsg(`${t.name}: ${t.payType==="Percent"?t.payPercent+"% of job":"paid per hour"}`); render();
}
function backupExport(){ DB.meta.lastBackup=new Date().toISOString(); saveDB(); downloadFile("mopzilla_backup_"+todayStr()+".json",JSON.stringify(DB,null,2),"application/json"); flashMsg("Backup file saved to your Downloads."); if(currentPage==="data"||currentPage==="command") render(); }
function backupImport(file){
  if(!file) return; const reader=new FileReader();
  reader.onload=()=>{ try{ const p=JSON.parse(reader.result); if(!p.jobs||!p.teams) throw new Error("File does not look like a Mopzilla backup."); DB=migrateDB(p); invalidateZipIndex(); saveDB(); flashMsg("Backup restored."); render(); }
    catch(e){ const m=document.getElementById("backupMsg"); if(m) m.innerHTML=`<span class="pill pill-danger">Import failed: ${esc(e.message)}</span>`; } };
  reader.readAsText(file);
}
function resetDemoData(){ if(!confirm("Replace ALL current data with fresh demo data?")) return; DB=seedDemoData(); invalidateZipIndex(); workingDate=DB.meta.demoDate||todayStr(); saveDB(); render(); }
function clearAllOperationalData(){
  if(!confirm("Delete ALL jobs, teams, employees, clients, properties and subcontractors so you can start with your real data? (Rules and ZIP data stay.) Save a backup first if unsure.")) return;
  Object.assign(DB,{jobs:[],teams:[],employees:[],clients:[],properties:[],subcontractors:[],overrides:{},payAdjustments:[],payStatus:{}}); delete DB.meta.demoDate; workingDate=todayStr();
  logAudit("All operational data cleared","","", "Start fresh"); saveDB(); render();
}
function askPersist(){
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok=>flashMsg(ok?"Browser will keep this data unless you clear it yourself.":"The browser did not grant extra protection — keep backups."));
  else flashMsg("This browser does not offer that option — keep backups.");
}
let zipQuery="", zipState="", zipCoreOnly=false;
function drawZipTable(){
  const q=zipQuery.trim().toLowerCase(), core=new Set(DB.serviceArea.coreZips);
  let list=allZipRecords().filter(r=>(!zipState||r.state===zipState)&&(!zipCoreOnly||core.has(r.zip))&&(!q||[r.zip,r.city,r.county].join(" ").toLowerCase().includes(q))).sort((a,b)=>a.zip.localeCompare(b.zip));
  const n=list.length; list=list.slice(0,300);
  document.getElementById("zipTable").innerHTML=`<div class="small muted">${n.toLocaleString()} match(es)${n>300?" — showing the first 300":""}</div><table><thead><tr><th>ZIP</th><th>City</th><th>State</th><th>County</th><th>Lat</th><th>Lon</th><th>Type</th><th>Core</th></tr></thead><tbody>${list.map(r=>`<tr><td>${r.zip}</td><td>${esc(r.city)}</td><td>${r.state}</td><td>${esc(r.county)}</td><td>${r.latitude.toFixed(4)}</td><td>${r.longitude.toFixed(4)}</td><td>${esc(r.type)}${r.source==="imported"?" · imported":""}</td><td>${core.has(r.zip)?"✓":""}</td></tr>`).join("")}</tbody></table>`;
}
function saveCoreZips(){
  const zips=[...new Set((document.getElementById("coreZips").value.match(/\b\d{5}\b/g)||[]))], bad=zips.filter(z=>!zipLookup(z));
  DB.serviceArea.coreZips=zips; logAudit("Core service area saved","",`${zips.length} ZIPs`,""); saveDB();
  document.getElementById("coreMsg").innerHTML=`<span class="pill pill-ok">Saved ${zips.length} ZIPs</span>${bad.length?` <span class="pill pill-warn">not in database: ${esc(bad.slice(0,8).join(", "))}</span>`:""}`;
}
function resetCoreZips(){ DB.serviceArea.coreZips=CORE_ZIPS.slice(); saveDB(); render(); }
function exportZips(){ downloadFile("ky_oh_in_zips.csv",csvFromRows(["zip","city","state","county","latitude","longitude","type"],allZipRecords().sort((a,b)=>a.zip.localeCompare(b.zip)).map(r=>[r.zip,r.city,r.state,r.county,r.latitude,r.longitude,r.type])),"text/csv"); }
function importZips(){
  const f=document.getElementById("zipFile").files[0], mode=document.getElementById("zipMode").value, msg=document.getElementById("zipMsg");
  if(!f){ msg.innerHTML=`<span class="pill pill-warn">Choose a CSV file first.</span>`; return; }
  const rd=new FileReader();
  rd.onload=()=>{
    const lines=rd.result.split(/\r?\n/).filter(l=>l.trim()), out=[], errs=[], seen=new Set();
    lines.forEach((line,i)=>{
      const c=line.split(",").map(s=>s.trim().replace(/^"|"$/g,""));
      if(i===0 && /zip/i.test(c[0])) return;
      const zip=c[0], st=(c[2]||"").toUpperCase(), lat=parseFloat(c[4]), lon=parseFloat(c[5]);
      if(!/^\d{5}$/.test(zip)) return errs.push(`row ${i+1}: bad ZIP`);
      if(!["KY","OH","IN"].includes(st)) return errs.push(`row ${i+1}: state must be KY, OH or IN`);
      if(!isFinite(lat)||!isFinite(lon)||lat<36||lat>42.5||lon<-89.7||lon>-80.4) return errs.push(`row ${i+1}: coordinates outside KY/OH/IN`);
      if(seen.has(zip)) return errs.push(`row ${i+1}: duplicate ZIP in file`); seen.add(zip);
      out.push({zip,city:c[1]||"",state:st,county:c[3]||"",latitude:lat,longitude:lon,type:"STANDARD"});
    });
    if(mode==="replace") DB.zip.extra=[];
    const map={}; (DB.zip.extra||[]).forEach(r=>{ map[r.zip]=r; }); out.forEach(r=>{ map[r.zip]=r; }); DB.zip.extra=Object.values(map);
    invalidateZipIndex(); logAudit("ZIP import","",`${out.length} added/updated`,f.name); saveDB();
    msg.innerHTML=`<span class="pill pill-ok">${out.length} ZIP(s) imported</span>${errs.length?` <span class="pill pill-warn">${errs.length} skipped</span> <span class="small">${esc(errs.slice(0,4).join("; "))}</span>`:""}`;
  };
  rd.readAsText(f);
}
boot();
